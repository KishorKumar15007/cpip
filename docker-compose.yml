services:
  redis:
    image: redis:7-alpine
    container_name: cpip-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

    command: redis-server /usr/local/etc/redis/redis.conf

    restart: unless-stopped

volumes:
  redis-data:
